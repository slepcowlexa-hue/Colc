<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>iPhone Calculator Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000000;
      color: #ffffff;
      padding: 16px;
      overflow: hidden;
    }

    /* Корпус калькулятора в стиле iOS */
    .calculator {
      width: 100%;
      max-width: 340px;
      padding: 20px 16px 24px 16px;
      border-radius: 40px;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    /* Дисплей */
    .display-container {
      width: 100%;
      padding: 0 12px 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      min-height: 110px;
    }

    .display {
      width: 100%;
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 64px;
      font-weight: 300;
      text-align: right;
      outline: none;
      letter-spacing: -1px;
      white-space: nowrap;
      overflow: hidden;
    }

    /* Сетка кнопок */
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      height: 68px;
      width: 68px;
      border-radius: 50%;
      border: none;
      font-size: 28px;
      font-weight: 400;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: filter 0.2s ease, opacity 0.2s ease;
    }

    button:active {
      filter: brightness(140%);
    }

    /* Серые светлые кнопки (AC, ±, %) */
    .btn-light-gray {
      background-color: #a5a5a5;
      color: #000000;
    }

    .btn-light-gray:active {
      background-color: #d9d9d9;
    }

    /* Серые тёмные кнопки (Цифры) */
    .btn-dark-gray {
      background-color: #333333;
      color: #ffffff;
    }

    .btn-dark-gray:active {
      background-color: #555555;
    }

    /* Оранжевые операторы */
    .btn-orange {
      background-color: #ff9f0a;
      color: #ffffff;
      font-size: 32px;
    }

    .btn-orange.active {
      background-color: #ffffff;
      color: #ff9f0a;
    }

    /* Нулевая кнопка */
    .btn-zero {
      grid-column: span 2;
      width: 100%;
      border-radius: 35px;
      justify-content: flex-start;
      padding-left: 26px;
    }

    /* Кнопка отправки в бот */
    .send-btn {
      grid-column: span 4;
      width: 100%;
      height: 48px;
      margin-top: 10px;
      border-radius: 24px;
      background-color: #2c2c2e;
      color: #0a84ff;
      font-size: 16px;
      font-weight: 600;
    }

    .send-btn:active {
      background-color: #3a3a3c;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <div class="display-container">
      <input type="text" class="display" id="display" readonly value="0">
    </div>

    <div class="buttons">
      <button class="btn-light-gray" id="clear-btn" onclick="handleClear()">AC</button>
      <button class="btn-light-gray" onclick="handleToggleSign()">±</button>
      <button class="btn-light-gray" onclick="handlePercent()">%</button>
      <button class="btn-orange" id="op-divide" onclick="handleOperator('/')">÷</button>

      <button class="btn-dark-gray" onclick="handleDigit('7')">7</button>
      <button class="btn-dark-gray" onclick="handleDigit('8')">8</button>
      <button class="btn-dark-gray" onclick="handleDigit('9')">9</button>
      <button class="btn-orange" id="op-multiply" onclick="handleOperator('*')">×</button>

      <button class="btn-dark-gray" onclick="handleDigit('4')">4</button>
      <button class="btn-dark-gray" onclick="handleDigit('5')">5</button>
      <button class="btn-dark-gray" onclick="handleDigit('6')">6</button>
      <button class="btn-orange" id="op-subtract" onclick="handleOperator('-')">−</button>

      <button class="btn-dark-gray" onclick="handleDigit('1')">1</button>
      <button class="btn-dark-gray" onclick="handleDigit('2')">2</button>
      <button class="btn-dark-gray" onclick="handleDigit('3')">3</button>
      <button class="btn-orange" id="op-add" onclick="handleOperator('+')">+</button>

      <button class="btn-dark-gray btn-zero" onclick="handleDigit('0')">0</button>
      <button class="btn-dark-gray" onclick="handleDecimal()">,</button>
      <button class="btn-orange" onclick="handleEqual()">=</button>

      <button class="send-btn" onclick="sendToBot()">Отправить в бот</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');
    const clearBtn = document.getElementById('clear-btn');
    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.expand();
      tg.ready();
    }

    let currentValue = '0';
    let previousValue = null;
    let currentOperator = null;
    let waitingForNextValue = false;

    function updateDisplay() {
      let formatted = currentValue.replace('.', ',');
      if (formatted.length > 7) {
        display.style.fontSize = '44px';
      } else if (formatted.length > 5) {
        display.style.fontSize = '52px';
      } else {
        display.style.fontSize = '64px';
      }
      display.value = formatted;
      clearBtn.innerText = currentValue !== '0' ? 'C' : 'AC';
    }

    function clearActiveOperators() {
      document.querySelectorAll('.btn-orange').forEach(btn => btn.classList.remove('active'));
    }

    function handleDigit(digit) {
      if (waitingForNextValue) {
        currentValue = digit;
        waitingForNextValue = false;
      } else {
        currentValue = currentValue === '0' ? digit : currentValue + digit;
      }
      clearActiveOperators();
      updateDisplay();
    }

    function handleDecimal() {
      if (waitingForNextValue) {
        currentValue = '0.';
        waitingForNextValue = false;
      } else if (!currentValue.includes('.')) {
        currentValue += '.';
      }
      clearActiveOperators();
      updateDisplay();
    }

    function handleClear() {
      currentValue = '0';
      previousValue = null;
      currentOperator = null;
      waitingForNextValue = false;
      clearActiveOperators();
      updateDisplay();
    }

    function handleToggleSign() {
      if (currentValue === '0') return;
      currentValue = (parseFloat(currentValue) * -1).toString();
      updateDisplay();
    }

    function handlePercent() {
      if (currentValue === '0') return;
      currentValue = (parseFloat(currentValue) / 100).toString();
      updateDisplay();
    }

    function handleOperator(op) {
      clearActiveOperators();
      
      const opMap = { '/': 'op-divide', '*': 'op-multiply', '-': 'op-subtract', '+': 'op-add' };
      document.getElementById(opMap[op])?.classList.add('active');

      if (currentOperator && !waitingForNextValue) {
        calculate();
      }

      previousValue = currentValue;
      currentOperator = op;
      waitingForNextValue = true;
    }

    function calculate() {
      if (previousValue === null || currentOperator === null) return;

      const prev = parseFloat(previousValue);
      const current = parseFloat(currentValue);
      let result = 0;

      switch (currentOperator) {
        case '+': result = prev + current; break;
        case '-': result = prev - current; break;
        case '*': result = prev * current; break;
        case '/': result = current !== 0 ? prev / current : 'Ошибка'; break;
      }

      if (result === 'Ошибка') {
        currentValue = 'Ошибка';
      } else {
        currentValue = Number(result.toFixed(8)).toString();
      }

      previousValue = null;
      currentOperator = null;
    }

    function handleEqual() {
      clearActiveOperators();
      if (!currentOperator) return;
      calculate();
      waitingForNextValue = true;
      updateDisplay();
    }

    function sendToBot() {
      if (!currentValue || currentValue === 'Ошибка') return;
      if (tg && tg.sendData) {
        tg.sendData(currentValue);
      } else {
        alert('Откройте калькулятор через Telegram');
      }
    }
  </script>

</body>
</html>
