<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Neo Calculator Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a002c, #00223e, #1d976c);
      background-size: 400% 400%;
      animation: gradientFlow 15s ease infinite;
      color: #fff;
      padding: 16px;
      overflow: hidden;
    }

    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Фоновый неоновый блик */
    .glow-orb {
      position: absolute;
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, rgba(0, 242, 254, 0.35) 0%, rgba(79, 172, 254, 0) 70%);
      border-radius: 50%;
      z-index: 0;
      animation: floatOrb 8s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes floatOrb {
      0% { transform: translate(-30px, -40px) scale(0.9); }
      100% { transform: translate(30px, 40px) scale(1.1); }
    }

    /* Корпус калькулятора */
    .calculator {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 330px;
      padding: 24px 20px;
      border-radius: 32px;
      background: rgba(18, 18, 28, 0.55);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6),
                  inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }

    /* Дисплей */
    .display-container {
      margin-bottom: 20px;
      padding: 16px 18px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      min-height: 85px;
    }

    .expression {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.5);
      min-height: 18px;
      margin-bottom: 4px;
      word-break: break-all;
    }

    .display {
      width: 100%;
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 36px;
      font-weight: 700;
      text-align: right;
      outline: none;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 10px rgba(255, 255, 255, 0.2);
    }

    /* Сетка кнопок */
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      height: 60px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      font-size: 22px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.22);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    /* Операторы */
    .operator {
      background: linear-gradient(135deg, rgba(255, 159, 10, 0.6), rgba(255, 120, 0, 0.6));
      border-color: rgba(255, 159, 10, 0.4);
      color: #fff;
    }

    .operator:active {
      background: linear-gradient(135deg, rgba(255, 159, 10, 0.8), rgba(255, 120, 0, 0.8));
    }

    /* Кнопка РАВНО */
    .equal {
      background: linear-gradient(135deg, rgba(0, 230, 118, 0.7), rgba(0, 178, 89, 0.7));
      border-color: rgba(0, 230, 118, 0.5);
      box-shadow: 0 4px 20px rgba(0, 230, 118, 0.3);
    }

    .equal:active {
      background: linear-gradient(135deg, rgba(0, 230, 118, 0.9), rgba(0, 178, 89, 0.9));
    }

    /* Кнопка ОЧИСТИТЬ */
    .clear {
      background: linear-gradient(135deg, rgba(255, 69, 58, 0.6), rgba(215, 40, 30, 0.6));
      border-color: rgba(255, 69, 58, 0.4);
    }

    .clear:active {
      background: linear-gradient(135deg, rgba(255, 69, 58, 0.8), rgba(215, 40, 30, 0.8));
    }

    /* Дополнительные функции */
    .function-btn {
      background: rgba(255, 255, 255, 0.16);
      color: #00f2fe;
    }

    /* Главная кнопка действия */
    .send-btn {
      grid-column: span 4;
      margin-top: 4px;
      height: 52px;
      background: linear-gradient(135deg, rgba(0, 198, 251, 0.7), rgba(0, 91, 234, 0.7));
      border-color: rgba(0, 198, 251, 0.5);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 20px rgba(0, 198, 251, 0.3);
    }

    .send-btn:active {
      background: linear-gradient(135deg, rgba(0, 198, 251, 0.9), rgba(0, 91, 234, 0.9));
    }
  </style>
</head>
<body>

  <div class="glow-orb"></div>

  <div class="calculator">
    <div class="display-container">
      <div class="expression" id="expression"></div>
      <input type="text" class="display" id="display" readonly value="0">
    </div>

    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">AC</button>
      <button class="function-btn" onclick="toggleSign()">±</button>
      <button class="function-btn" onclick="appendValue('%')">%</button>
      <button onclick="appendValue('/')" class="operator">÷</button>

      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button onclick="appendValue('*')" class="operator">×</button>

      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button onclick="appendValue('-')" class="operator">−</button>

      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button onclick="appendValue('+')" class="operator">+</button>

      <button onclick="appendValue('0')" style="grid-column: span 2;">0</button>
      <button onclick="appendValue('.')">.</button>
      <button onclick="calculate()" class="equal">=</button>

      <button class="send-btn" onclick="sendToBot()">Отправить в бот</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');
    const expressionEl = document.getElementById('expression');
    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.expand();
      tg.ready();
    }

    let isNewCalculation = false;

    function appendValue(val) {
      if (display.value === 'Ошибка' || isNewCalculation) {
        if (!['+', '-', '*', '/', '%'].includes(val)) {
          display.value = '';
        }
        isNewCalculation = false;
      }

      if (display.value === '0' && val !== '.') {
        display.value = val;
      } else {
        display.value += val;
      }
    }

    function clearDisplay() {
      display.value = '0';
      expressionEl.innerText = '';
      isNewCalculation = false;
    }

    function toggleSign() {
      if (display.value === '0' || display.value === 'Ошибка') return;
      if (display.value.startsWith('-')) {
        display.value = display.value.slice(1);
      } else {
        display.value = '-' + display.value;
      }
    }

    function calculate() {
      if (!display.value || display.value === 'Ошибка') return;
      try {
        let rawExpr = display.value;
        expressionEl.innerText = rawExpr + ' =';
        
        let formattedExpr = rawExpr.replace(/%/g, '/100');
        let result = Function(`'use strict'; return (${formattedExpr})`)();

        if (Number.isFinite(result)) {
          display.value = Number(result.toFixed(8)).toString();
          isNewCalculation = true;
        } else {
          display.value = 'Ошибка';
        }
      } catch {
        display.value = 'Ошибка';
      }
    }

    function sendToBot() {
      if (!display.value || display.value === 'Ошибка') return;
      if (tg && tg.sendData) {
        tg.sendData(display.value);
      } else {
        alert('Откройте калькулятор через Telegram');
      }
    }
  </script>

</body>
</html>
